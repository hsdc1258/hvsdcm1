<!doctype html>
<html lang="ko">
<head>

  <title>2027 사회·문화 개념 회독</title>
  <style>
    :root{color-scheme:dark;--bg:#090b0d;--surface:#111419;--surface2:#171b21;--surface3:#1d222a;--line:#29303a;--soft:#20262e;--text:#f5f7f9;--muted:#9ba4b0;--muted2:#6f7885;--accent:#86efac;--accent2:#4ade80;--accentbg:rgba(74,222,128,.12);--danger:#fb7185;--dangerbg:rgba(251,113,133,.12);--warn:#facc15;--warnbg:rgba(250,204,21,.11);--blue:#7dd3fc;--bluebg:rgba(125,211,252,.1);--radius:22px;--max:1060px}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -12%,rgba(134,239,172,.09),transparent 32rem),var(--bg);color:var(--text);font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app-shell{width:min(100%,var(--max));min-height:100vh;margin:auto;padding:0 24px;display:flex;flex-direction:column}.site-header{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:0;cursor:pointer;text-align:left}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--text);color:#09100c;font-weight:950;letter-spacing:-.08em}.brand-copy{display:grid;line-height:1.05}.brand-copy strong{font-size:13px;letter-spacing:.08em}.brand-copy small{color:var(--muted);font-size:10px;letter-spacing:.16em;margin-top:4px}.header-actions{display:flex;gap:8px}main{flex:1;padding:28px 0 68px}.site-footer{border-top:1px solid var(--soft);padding:22px 0 34px;color:var(--muted2);font-size:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
    h1,h2,h3,h4,p{margin-top:0}h1{margin-bottom:15px;font-size:clamp(38px,7vw,66px);line-height:1.01;letter-spacing:-.06em}h2{font-size:24px;letter-spacing:-.035em}h3{letter-spacing:-.02em}.eyebrow{margin:0 0 10px;color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.12em}.hero{margin-bottom:28px}.hero>p:last-child{color:var(--muted);max-width:720px;line-height:1.75;margin-bottom:0}.card{background:linear-gradient(180deg,rgba(255,255,255,.018),transparent),var(--surface);border:1px solid var(--soft);border-radius:var(--radius);padding:24px}.muted{color:var(--muted);line-height:1.65}.grid{display:grid;gap:16px}.grid.two{grid-template-columns:minmax(0,1.45fr) minmax(270px,.7fr)}.primary,.secondary,.ghost,.danger{border-radius:13px;border:1px solid transparent;cursor:pointer;font-weight:800;min-height:46px;padding:0 16px;transition:.14s ease}.primary{background:var(--accent);color:#07140c}.primary:hover{background:var(--accent2)}.secondary{background:var(--surface3);border-color:var(--line)}.secondary:hover,.ghost:hover{border-color:#46505f}.ghost{background:transparent;border-color:var(--line);color:var(--muted)}.ghost:hover{color:var(--text);background:var(--surface2)}.danger{background:var(--dangerbg);border-color:rgba(251,113,133,.25);color:var(--danger)}.compact{min-height:38px;padding:0 12px;font-size:12px}button:disabled{opacity:.36;cursor:not-allowed}.full{width:100%}.button-row{display:flex;gap:9px;flex-wrap:wrap}.button-row>*{flex:1}.badge{display:inline-flex;align-items:center;min-height:26px;padding:0 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px;font-weight:800}.badge.green{background:var(--accentbg);border-color:rgba(74,222,128,.24);color:var(--accent)}.badge.warn{background:var(--warnbg);border-color:rgba(250,204,21,.22);color:var(--warn)}
    .overview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:var(--surface2);border:1px solid var(--soft);border-radius:15px;padding:15px}.stat span{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.stat strong{font-size:23px}.review-card{margin-top:14px;padding:18px;border:1px solid var(--line);background:var(--surface2);border-radius:17px}.review-card h3{font-size:16px;margin-bottom:5px}.review-card p{font-size:13px;color:var(--muted);line-height:1.55}.setup-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.setup-row label{display:block;color:var(--muted);font-size:11px;font-weight:750;margin-bottom:7px}select{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text)}
    .unit-list{display:grid;gap:13px}.unit-card{border:1px solid var(--soft);border-radius:19px;background:var(--surface);overflow:hidden}.unit-head{padding:19px 20px 15px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.unit-index{color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.09em}.unit-head h3{font-size:20px;margin:5px 0 6px}.unit-head p{color:var(--muted);font-size:13px;line-height:1.55;margin:0}.unit-progress{min-width:86px;text-align:right}.unit-progress strong{font-size:18px}.unit-progress small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.subunit-list{border-top:1px solid var(--soft)}.subunit-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--soft)}.subunit-row:first-child{border-top:0}.subunit-row:hover{background:rgba(255,255,255,.012)}.check{width:19px;height:19px;accent-color:var(--accent)}.subunit-copy strong{display:block;font-size:14px}.subunit-copy small{display:block;color:var(--muted);font-size:11px;margin-top:5px;line-height:1.45}.sub-actions{display:flex;align-items:center;gap:7px}.done-dot{width:8px;height:8px;border-radius:50%;background:var(--line)}.done-dot.on{background:var(--accent);box-shadow:0 0 0 4px var(--accentbg)}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}.page-head h2{margin:5px 0 7px;font-size:clamp(27px,5vw,42px)}.page-head p{color:var(--muted);line-height:1.6;margin:0}.concept-nav{position:sticky;top:8px;z-index:3;display:flex;gap:8px;align-items:center;margin-bottom:14px;padding:9px;border:1px solid var(--soft);border-radius:15px;background:rgba(17,20,25,.94);backdrop-filter:blur(12px);overflow:auto}.concept-nav button{white-space:nowrap}.concept-grid{display:grid;gap:14px}.concept-section h3{font-size:19px;margin-bottom:15px}.concept-section ul{padding-left:20px;margin:0}.concept-section li{color:#dce1e7;line-height:1.72;margin:8px 0}.trap{margin-top:17px;padding:14px 15px;border-radius:14px;background:var(--warnbg);border:1px solid rgba(250,204,21,.18);color:#f4e7a3;font-size:13px;line-height:1.65}.trap strong{color:var(--warn)}.concept-finish{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.source-note{margin-top:14px;color:var(--muted2);font-size:11px;line-height:1.55}
    .quiz-wrap{max-width:830px;margin:auto}.quiz-head{margin-bottom:14px}.quiz-meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;font-weight:750;margin-bottom:9px}.progress-track{height:6px;border-radius:999px;background:var(--surface3);overflow:hidden}.progress-fill{height:100%;border-radius:inherit;background:var(--accent);transition:width .2s}.question-card{border:1px solid var(--soft);border-radius:26px;background:var(--surface);padding:clamp(23px,5vw,42px)}.question-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.question-kicker{color:var(--accent);font-size:11px;font-weight:850;letter-spacing:.08em}.question-card h2{font-size:clamp(24px,4.5vw,37px);line-height:1.35;margin:30px 0 25px;white-space:pre-line}.answer-label{display:block;color:var(--muted);font-size:12px;font-weight:750;margin-bottom:8px}.answer-row{display:grid;grid-template-columns:1fr auto;gap:9px}.answer-input{width:100%;min-height:54px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--text);padding:14px 16px;font-size:17px;resize:vertical}.answer-input::placeholder{color:var(--muted2)}.answer-row .primary{min-width:110px}.key-hint{color:var(--muted2);font-size:11px;margin-top:9px}.choice-list{display:grid;gap:9px}.choice-option{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;align-items:center;width:100%;min-height:58px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--text);cursor:pointer;text-align:left;transition:.14s ease}.choice-option:hover{border-color:#536071;background:var(--surface3)}.choice-option span{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--surface3);color:var(--muted);font-size:12px;font-weight:900}.choice-option strong{font-size:14px;line-height:1.52}.choice-option:disabled{opacity:1;cursor:default}.choice-option.correct-option{border-color:rgba(74,222,128,.5);background:var(--accentbg)}.choice-option.correct-option span{background:var(--accent);color:#07140c}.choice-option.wrong-option{border-color:rgba(251,113,133,.5);background:var(--dangerbg)}.choice-option.wrong-option span{background:var(--danger);color:#1b070b}.choice-next{margin-top:12px}.feedback{margin-top:22px;padding:18px;border-radius:17px;border:1px solid}.feedback.correct{background:var(--accentbg);border-color:rgba(74,222,128,.22)}.feedback.partial{background:var(--warnbg);border-color:rgba(250,204,21,.22)}.feedback.wrong{background:var(--dangerbg);border-color:rgba(251,113,133,.22)}.feedback-title{font-weight:900;margin-bottom:14px}.feedback.correct .feedback-title{color:var(--accent)}.feedback.partial .feedback-title{color:var(--warn)}.feedback.wrong .feedback-title{color:var(--danger)}.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feedback-item{padding:12px;background:rgba(0,0,0,.14);border-radius:12px}.feedback-item small{display:block;color:var(--muted);font-size:10px;margin-bottom:6px}.feedback-item strong{font-size:13px;line-height:1.5}.explain{margin:13px 0 0;color:#d9dee5;font-size:13px;line-height:1.68}.match-info{margin-top:10px;color:var(--muted);font-size:11px}.feedback-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
    .result-score{text-align:center;font-size:clamp(62px,14vw,104px);font-weight:950;letter-spacing:-.07em;color:var(--accent);margin:20px 0 5px}.result-copy{text-align:center;color:var(--muted)}.mistake-list{display:grid;gap:8px;margin-top:14px}.mistake-row{display:grid;grid-template-columns:minmax(160px,.8fr) 1.4fr;gap:16px;padding:14px;border:1px solid var(--soft);border-radius:14px;background:var(--surface2)}.mistake-row strong{font-size:13px;line-height:1.5}.mistake-row small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.user-answer{color:var(--danger);font-size:11px;margin-top:6px}.stats-table{display:grid;gap:8px;margin-top:12px}.stats-row{display:grid;grid-template-columns:minmax(0,1fr) 82px 76px;gap:10px;align-items:center;padding:12px 13px;border:1px solid var(--soft);border-radius:13px;background:var(--surface2)}.stats-row span{font-size:13px}.stats-row small{color:var(--muted);text-align:right}.file-input{position:absolute;opacity:0;width:1px;height:1px}.empty{text-align:center;color:var(--muted);padding:34px 10px}.toast{position:fixed;left:50%;bottom:26px;z-index:20;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#f5f7f9;color:#111;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:800;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:780px){.grid.two{grid-template-columns:1fr}.unit-progress{min-width:68px}.subunit-row{grid-template-columns:auto minmax(0,1fr)}.sub-actions{grid-column:2}.concept-finish{grid-template-columns:1fr}.mistake-row{grid-template-columns:1fr}.stats-row{grid-template-columns:minmax(0,1fr) 68px 62px}}
    @media(max-width:540px){.app-shell{padding:0 15px}.site-header{min-height:68px}.brand-copy small{display:none}.site-header .ghost{padding:0 10px}.card{padding:19px;border-radius:19px}main{padding-top:19px}.overview{grid-template-columns:1fr 1fr}.overview .stat:last-child{grid-column:1/-1}.unit-head{padding:17px}.subunit-row{padding:13px 15px}.sub-actions .ghost{min-height:35px}.page-head{display:block}.page-head>button{margin-top:12px}.question-card{padding:22px 18px}.answer-row{grid-template-columns:1fr}.answer-row .primary{width:100%}.feedback-grid{grid-template-columns:1fr}.button-row{display:grid}.quiz-meta{font-size:11px}.setup-row{grid-template-columns:1fr}.header-actions .label-wide{display:none}}
  </style>

<body>
  <div class="app-shell">
    <header class="site-header">
      <button id="homeLogo" class="brand" type="button" aria-label="홈으로">
        <span class="brand-mark">社</span><span class="brand-copy"><strong>SOCIETY · CULTURE</strong><small>2027 CONCEPT LOOP</small></span>
      </button>
      <div class="header-actions"><button id="openStats" class="ghost compact" type="button"><span class="label-wide">학습 </span>기록</button></div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer"><span>2027 수능 사회·문화 · 1~4단원</span><span>모든 기록은 이 브라우저에만 저장됩니다.</span></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/account.js" data-app="smstudy" data-key="samun2027.study.v1"></script>
  <script>
  (() => {
    'use strict';
    const STORAGE_KEY = 'samun2027.study.v1';
    const UNITS = [
      {id:'I',title:'사회·문화 현상의 탐구',desc:'현상 구분, 관점, 연구 방법, 자료 수집, 연구 윤리',subs:[
        {id:'I-01',title:'탐구 대상으로서의 사회·문화 현상',time:18,keywords:'자연 현상 · 사회·문화 현상 · 기능론 · 갈등론 · 상징적 상호 작용론',sections:[
          {title:'자연 현상과 사회·문화 현상',points:['자연 현상은 인간의 의지와 무관하게 발생하며 필연성·확실성, 보편성, 몰가치성이 강하다.','사회·문화 현상은 인간의 가치·의지·목적이 개입하며 개연성·확률성, 보편성과 특수성이 함께 나타난다.','두 현상 모두 경험 자료로 과학적으로 탐구할 수 있고 인과 관계와 규칙성을 찾을 수 있다.'],trap:'문장에 제시되지 않은 인간의 배경을 상상하지 않는다. 태풍 때문에 나무가 쓰러진 현상은 자연 현상이다.'},
          {title:'거시 관점: 기능론과 갈등론',points:['기능론은 사회를 상호 의존하는 부분들의 체계로 보고 합의·통합·균형을 강조한다. 사회 문제는 일시적 기능 장애로 본다.','갈등론은 희소 자원을 둘러싼 지배·피지배와 강제를 강조한다. 불평등을 구조적 모순으로 보고 갈등을 변동의 원동력으로 본다.','기능론은 불평등·기존 질서 옹호 가능성, 갈등론은 통합·안정과 합의를 경시한다는 비판을 받는다.'],trap:'‘지배적 규범’만으로 갈등론이라 단정하지 않는다. ‘지배 집단의 이익’이 제시되어야 근거가 강하다.'},
          {title:'미시 관점: 상징적 상호 작용론',points:['개인은 상징을 매개로 상호 작용하며 상황을 해석하고 의미를 구성한다.','행위자는 구조에 끌려가는 수동적 존재가 아니라 상황 정의에 따라 행동하는 능동적 존재다.','일상적 상호 작용을 깊게 설명하지만 거시 구조의 강한 영향력을 경시할 수 있다.'],trap:'기능론·갈등론은 거시, 상징적 상호 작용론은 미시 관점이다.'}
        ]},
        {id:'I-02',title:'사회·문화 현상의 탐구 방법',time:30,keywords:'양적·질적 연구 · 가설과 변인 · 1차·2차 자료 · 다섯 자료 수집법',sections:[
          {title:'양적 연구와 질적 연구',points:['양적 연구는 방법론적 일원론·실증주의에 기초해 수치 자료로 변수 관계와 일반 법칙을 찾고, 주로 연역적으로 가설을 검증한다.','질적 연구는 방법론적 이원론·해석주의에 기초해 언어·행동·경험을 통해 동기와 맥락을 이해하고, 주로 귀납적으로 개념을 만든다.','둘 다 경험적 자료를 사용하고 상호 보완할 수 있다. 도구 이름 하나만으로 연구 성격을 단정하지 않는다.'],trap:'질문지=항상 양적, 면접=항상 질적이 아니다. 폐쇄형·개방형 설계와 자료 처리 방식을 본다.'},
          {title:'가설·변인·가치 중립',points:['독립 변인은 원인·처치·설명 변수, 종속 변인은 그에 따라 달라질 것으로 보는 결과 변수다.','조작적 정의는 추상적 개념을 측정 가능한 지표로 바꾸는 것이다. 좋은 가설은 검증 가능하고 변인 관계가 명확하며 당위 판단이 없어야 한다.','주제·가설·설계 선택과 결과 활용에는 가치가 개입할 수 있으나 자료 수집·분석·가설 검증에서는 가치 중립을 지켜야 한다.'],trap:'연구자가 가설을 선택할 때 가치가 개입할 수 있다는 사실과 가설 문장 자체가 가치 판단이라는 말은 다르다.'},
          {title:'1차·2차 자료와 자료 수집법',points:['1차 자료는 현재 연구 목적을 위해 연구자가 직접 처음 수집한 자료다. 자기의 과거 자료도 새 연구에서 재활용하면 2차 자료다.','문헌 연구는 기존 자료, 질문지법은 대규모·통계, 실험법은 조작·통제와 인과, 면접법은 깊은 답변, 참여 관찰법은 실제 생활 맥락에 강점이 있다.','모집단은 연구 대상 전체, 표본은 실제 조사 대상 일부다. 무작위 표집은 대표성 확보에 유리하지만 대표성을 자동 보장하지 않는다.'],trap:'1차·2차 구분 기준은 ‘누가 만들었나’가 아니라 ‘현재 연구를 위해 직접 수집했나’이다.'}
        ]},
        {id:'I-03',title:'사회·문화 현상의 탐구와 연구 윤리',time:16,keywords:'객관적·개방적·상대주의적·성찰적 태도 · 동의 · 익명성 · 사후 설명',sections:[
          {title:'네 가지 탐구 태도',points:['객관적 태도는 연구자의 선호를 배제하고 제3자가 검증 가능한 절차와 근거를 중시한다.','개방적 태도는 지식을 잠정적 결과로 보고 새 증거와 합리적 비판을 받아들인다.','상대주의적 태도는 역사·문화적 맥락과 행위자 입장에서 이해하고, 성찰적 태도는 익숙한 전제와 연구의 영향을 되돌아본다.'],trap:'객관성은 주관이 전혀 없다는 뜻이 아니라 관찰자 사이에 공유 가능한 상호 주관성을 확보한다는 뜻이다.'},
          {title:'연구 대상자 보호',points:['자발적 참여와 충분한 사전 설명에 기초한 동의, 개인정보·익명성 보호가 원칙이다.','사전 고지가 행동을 왜곡할 때 일부 목적을 숨길 수 있으나 연구 후 충분히 설명하고 사후 동의를 받아야 한다.','익명성 보장은 개별 신원을 숨기는 것이며 집단 수준 연구 결과 전체를 숨긴다는 뜻은 아니다.'],trap:'과학적 엄밀성과 연구 윤리가 충돌하면 연구 윤리가 우선한다.'},
          {title:'연구 진실성',points:['자료를 위조·변조·날조하지 않고 결과를 과장하거나 왜곡하지 않는다.','타인의 연구를 인용 없이 사용하지 않으며 출처를 정확히 밝힌다.','연구 주제 자체도 사회적으로 유익하고 윤리적으로 정당해야 한다.'],trap:'성과가 좋아도 자료 조작과 표절은 정당화되지 않는다.'}

      {id:'II',title:'개인과 사회 구조',desc:'사회화, 지위와 역할, 사회 구조, 집단·조직, 일탈',subs:[
        {id:'II-01',title:'사회화와 사회적 상호 작용',time:21,keywords:'사회화 기관 · 예기·재사회화 · 거울 자아 · 지위·역할·갈등',sections:[
          {title:'사회화와 사회화 기관',points:['사회화는 지식·가치·규범·기술을 학습하고 문화를 내면화하는 평생 과정이다.','1차적 기관은 가족·또래처럼 기초 인성을, 2차적 기관은 학교·기업·대중 매체처럼 전문 지식과 역할을 학습시키는 경향이 있다.','공식적 사회화 기관은 사회화가 주된 목적이고 의도적·체계적이다. 가족·회사·대중 매체는 사회화가 부수적인 비공식적 사회화 기관이다.'],trap:'회사는 공식 조직이지만 사회화가 본래 목적은 아니므로 비공식적 사회화 기관이다.'},
          {title:'사회화 유형과 자아',points:['예기 사회화는 앞으로 들어갈 지위·집단의 규범을 미리 배우는 것, 재사회화는 변화한 환경에 맞게 새 규범과 기술을 다시 배우는 것이다.','쿨리의 거울 자아는 타인이 나를 어떻게 볼지 상상하고 그 평가를 내면화해 자아가 형성된다고 본다.','미드는 중요한 타자와 일반화된 타자의 기대를 내면화하며 자아가 발달한다고 본다.'],trap:'한 사례에서 예기 사회화와 재사회화가 겹칠 수 있다.'},
          {title:'지위·역할·역할 갈등',points:['귀속 지위는 의지와 무관하게 주어지고, 성취 지위는 노력·선택으로 획득한다.','역할은 특정 지위에 대한 사회적 기대, 역할 행동은 실제 수행이다. 평가는 역할이 아니라 역할 행동에 내려진다.','역할 갈등은 서로 다른 지위의 역할 기대가 동시에 충돌하는 상태다. 한 지위 안의 상충 기대는 역할 긴장이다.'],trap:'지위가 여러 개이거나 단순히 고민한다는 이유만으로 역할 갈등은 아니다. 실제 역할 기대의 충돌이 있어야 한다.'}

        {id:'II-02',title:'사회 구조와 개인의 삶',time:17,keywords:'사회 명목론 · 사회 실재론 · 뒤르켐 자살론 · 사회 구조',sections:[
          {title:'사회 명목론과 사회 실재론',points:['사회 명목론은 사회를 개인들의 합으로 보고 개인의 자율성·능동성·계약을 강조한다.','사회 실재론은 사회가 개인의 합을 넘어 독립적으로 존재하며 개인을 구속한다고 본다.','사회 계약론·개인주의는 명목론, 유기체론·전체론은 실재론과 가깝다.'],trap:'사회 실재론과 기능론은 같은 말이 아니다. 기능론과 갈등론 모두 거시 구조의 제약을 중시할 수 있다.'},
          {title:'뒤르켐의 자살론',points:['자살을 개인 심리만이 아니라 사회 통합과 사회 규제의 정도로 설명한다.','이기적 자살은 통합 약화, 이타적 자살은 통합 과잉과 관련된다.','아노미적 자살은 규제 약화, 숙명적 자살은 규제 과잉과 관련된다.'],trap:'통합과 규제를 서로 바꾸지 않는다.'},
          {title:'사회 구조의 성격',points:['사회 구조는 지위·역할·제도의 안정된 관계 양식이다.','안정성·지속성·예측 가능성·강제성을 지니지만 사회별로 다르고 변할 수도 있다.','개인은 구조의 제약을 받으면서도 상호 작용을 통해 구조를 재생산하거나 변화시킬 수 있다.'],trap:'구조가 안정적이라는 말은 영원히 변하지 않는다는 뜻이 아니다.'}
        ]},
        {id:'II-03',title:'사회 집단과 사회 조직의 이해',time:27,keywords:'내·외·준거 집단 · 공동·이익사회 · 공식 조직 · 관료제 · 자발적 결사체',sections:[
          {title:'사회 집단과 분류 기준',points:['사회 집단은 2명 이상, 소속감·공동체 의식, 지속적 상호 작용을 갖는다.','내·외집단은 심리적 소속감과 거리감, 준거 집단은 행동·가치 판단·비교의 기준 여부로 구분한다.','공동사회는 결합 자체가 목적이고 본질 의지, 이익사회는 특정 목적 달성의 수단이고 선택 의지에 기초한다. 1차·2차 집단은 접촉과 관계 방식이 기준이다.'],trap:'공동사회/이익사회와 1차/2차 집단은 기준이 달라 완전히 일치하지 않는다.'},
          {title:'관료제와 탈관료제',points:['관료제는 수직 위계, 전문화, 명문화된 규칙, 비인격성, 연공서열, 상명하달을 특징으로 하며 안정적 환경에 적합하다.','탈관료제는 수평적 의사 결정, 팀·네트워크, 재량·창의성, 능력 중심 보상과 유연성을 강조한다.','둘 다 공식 조직의 운영 방식이며 한 조직에서 혼합될 수 있다. 탈관료제에도 업무 분화와 일부 규칙은 존재한다.'],trap:'탈관료제는 규칙이 전혀 없는 조직이 아니다.'},
          {title:'비공식 조직과 자발적 결사체',points:['비공식 조직은 공식 조직 내부의 친밀한 인간관계로 형성되어 긴장 완화와 소속감에 기여하지만 파벌을 낳을 수 있다.','자발적 결사체는 공통 관심을 바탕으로 자발적으로 가입하며 직접 경제 보상이 주목적이 아니다.','친목·시민·이익 집단이 자발적 결사체에 포함될 수 있지만 모든 자발적 결사체가 비공식 조직은 아니다.'],trap:'시민 단체처럼 공식 규칙을 갖춘 자발적 결사체도 존재한다.'}
        ]},
        {id:'II-04',title:'일탈 행동의 원인과 해결 방안',time:20,keywords:'아노미 · 차별 교제 · 낙인 · 1차·2차 일탈',sections:[
          {title:'일탈의 상대성',points:['일탈은 특정 사회의 규범에서 벗어난 행위이며 시대·사회·상황에 따라 기준이 달라진다.','아노미 이론은 객관적 일탈 기준의 존재를 전제하는 경향이 있다.','낙인 이론은 행위 자체보다 사회적 반응이 일탈자 정체성을 만든다고 본다.'],trap:'일탈의 상대성이 곧 규범과 제재가 불필요하다는 뜻은 아니다.'},
          {title:'아노미 이론',points:['뒤르켐은 급격한 변화로 기존 규범이 약화되고 새 규범이 미정립된 상태를 아노미로 본다. 해결은 규범·통제 회복이다.','머튼은 문화적 목표와 제도적 수단의 괴리를 강조한다. 합법적 기회와 수단 확대가 해결 방향이다.','머튼의 혁신형은 문화적 목표를 수용하지만 제도적 수단 대신 비제도적 수단을 사용한다.'],trap:'‘급격한 변동으로 규범 약화’는 뒤르켐, ‘목표-수단 괴리’는 머튼이다.'},
          {title:'차별 교제와 낙인',points:['차별 교제 이론은 일탈자와 지속적으로 접촉하며 일탈에 우호적인 정의와 기술을 학습한다고 본다.','낙인 이론은 1차 일탈 뒤 타인의 낙인과 차별적 제재가 부정적 자아를 형성해 2차 일탈로 이어진다고 본다.','차별 교제는 접촉 차단·건전한 집단 교류, 낙인은 신중한 제재·낙인 최소화를 처방한다.'],trap:'통제와 단속을 무조건 강화하는 처방은 낙인 이론과 반대 방향에 가깝다.'}

      {id:'III',title:'문화와 사회',desc:'문화의 의미·속성·관점, 하위문화와 대중문화, 문화 변동',subs:[
        {id:'III-01',title:'문화의 이해',time:23,keywords:'넓은·좁은 문화 · 물질·비물질 · 문화 속성 · 총체론·비교론·상대론',sections:[
          {title:'문화의 의미와 구성',points:['넓은 의미의 문화는 구성원이 공유하고 학습한 생활 양식 전체, 좁은 의미는 교양·예술·세련됨 같은 평가적 의미다.','물질문화는 도구·기계·건축과 물질을 다루는 기술, 비물질문화는 언어·가치·규범·관념·제도다.','문화 지체는 물질문화의 빠른 변화를 비물질문화가 따라가지 못해 부조화가 생기는 현상이다.'],trap:'기술은 눈에 보이지 않아도 물질을 다루고 변형하므로 교과상 물질문화다.'},
          {title:'문화의 다섯 속성',points:['학습성은 후천적 사회화, 공유성은 예측 가능한 공동생활, 축적성은 전승과 새 요소 추가를 뜻한다.','전체성은 문화 요소의 유기적 연결, 변동성은 발명·발견·전파 등으로 시간에 따라 변화함을 뜻한다.','‘새 요소가 더해짐’은 축적성, ‘시간이 지나 모습이 달라짐’은 변동성이다.'],trap:'제시문이 무엇을 강조하는지 끝까지 읽고 축적성과 변동성을 구분한다.'},
          {title:'문화 이해의 관점과 태도',points:['총체론적 관점은 한 문화 내부 요소들의 유기적 관련, 비교론적 관점은 문화 간 공통점·차이, 상대론적 관점은 역사·환경과 내부자 맥락을 본다.','자문화 중심주의와 문화 사대주의는 평가 기준만 다를 뿐 모두 문화 절대주의다.','문화 상대주의는 절대적 우열 판단을 경계하지만 극단화되면 보편적 인권까지 부정할 위험이 있다.'],trap:'한 사회 내부에서 가족·종교·경제의 연결을 보면 총체론, 형성 배경과 내부 의미를 보면 상대론이다.'}
        ]},

        '한 사람은 세 제도 중 하나만 이용할 수 있다.','사회 보험 가입자는 사회 서비스를 이용할 수 없다.','요건을 각각 충족하면 한 사람이 여러 제도의 지원을 함께 받을 수 있다.','공공 부조 수급자는 건강 보험의 적용을 절대 받을 수 없다.'

    const SUBUNITS = UNITS.flatMap(unit => unit.subs.map(sub => ({...sub,unitId:unit.id,unitTitle:unit.title})));
    const SUB_BY_ID = new Map(SUBUNITS.map(x=>[x.id,x]));
    const Q_BY_ID = new Map(QUESTIONS.map(x=>[x.id,x]));
    const app=document.getElementById('app'),toast=document.getElementById('toast');
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const norm=s=>String(s??'').toLowerCase().normalize('NFKC').replace(/[\s.,!?·:;()\[\]{}'"`~_\-/\\→]/g,'');
    const blankDb=()=>({version:1,attempts:0,correct:0,sessions:0,completed:{},qStats:{},wrongBank:{},customAliases:{}});
    function loadDb(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY));return v&&typeof v==='object'?{...blankDb(),...v,completed:v.completed||{},qStats:v.qStats||{},wrongBank:v.wrongBank||{},customAliases:v.customAliases||{}}:blankDb()}catch{return blankDb()}}
    let db=loadDb();
    db.wrongBank=Object.fromEntries(Object.entries(db.wrongBank).filter(([id])=>Q_BY_ID.has(id)));
    db.customAliases=Object.fromEntries(Object.entries(db.customAliases).filter(([id])=>Q_BY_ID.has(id)));
    const saveDb=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
    const state={view:'home',selected:new Set(),count:'20',order:'random',session:null,concept:null};
    let toastTimer;
    function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)}
    function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
    function stats(){const accuracy=db.attempts?Math.round(db.correct/db.attempts*100):0;return{accuracy,wrong:Object.keys(db.wrongBank).length,done:Object.keys(db.completed).length}}
    function subStats(id){const ids=QUESTIONS.filter(q=>q.sub===id).map(q=>q.id);let a=0,c=0;ids.forEach(qid=>{const x=db.qStats[qid];if(x){a+=x.attempts||0;c+=x.correct||0}});return{attempts:a,accuracy:a?Math.round(c/a*100):0}}
    function editDistance(a,b){const row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old}}return row[b.length]}
    function flexibleMatch(input,answer,allowTypos=true){const n=norm(input),a=norm(answer);if(!n||!a)return false;if(n===a||n.includes(a))return true;if(!allowTypos)return false;const limit=a.length>=7?2:a.length>=3?1:0;return limit>0&&Math.abs(n.length-a.length)<=limit&&editDistance(n,a)<=limit}
    function shownAnswer(q,input){if(q.type==='choice'){const i=Number(input);return Number.isInteger(i)&&q.options[i]?q.options[i]:'(선택 없음)'}return input||'(빈 답)'}
    function check(q,input){if(q.type==='choice'){const ok=Number(input)===q.correct;return{correct:ok,partial:false,hits:ok?1:0,total:1}}const n=norm(input);if(!n)return{correct:false,partial:false,hits:0,total:1};const custom=(db.customAliases[q.id]||[]).some(a=>flexibleMatch(input,a));if(custom)return{correct:true,partial:false,hits:1,total:1};const ok=q.answers.some(a=>flexibleMatch(input,a,!q.strict));return{correct:ok,partial:false,hits:ok?1:0,total:1}}
    function record(q,input,judged,mode){db.attempts++;if(judged.correct)db.correct++;const s=db.qStats[q.id]||{attempts:0,correct:0,wrong:0};s.attempts++;s.lastAt=Date.now();if(judged.correct){s.correct++;delete db.wrongBank[q.id]}else{s.wrong++;db.wrongBank[q.id]={count:(db.wrongBank[q.id]?.count||0)+1,lastAnswer:shownAnswer(q,input),lastWrongAt:Date.now(),sub:q.sub}}db.qStats[q.id]=s;saveDb()}
    function acceptCurrent(){const ss=state.session,q=ss?.questions[ss.index],r=ss?.last;if(!q||q.type!=='blank'||!r||r.correct||!r.input)return;(db.customAliases[q.id]||=[]).push(r.input);db.customAliases[q.id]=[...new Set(db.customAliases[q.id])];const st=db.qStats[q.id];if(st){st.correct=(st.correct||0)+1;st.wrong=Math.max(0,(st.wrong||0)-1)}db.correct++;delete db.wrongBank[q.id];r.correct=true;r.overridden=true;ss.correct++;ss.wrong=Math.max(0,ss.wrong-1);const row=ss.results[ss.results.length-1];if(row){row.correct=true;row.overridden=true}saveDb();renderQuiz();showToast('이 표현을 정답으로 저장했습니다.')}

    function renderHome(){state.view='home';state.session=null;const s=stats();app.innerHTML=`
      <section class="hero"><p class="eyebrow">READ → JUDGE → RETEST</p><h1>기출의 기준으로,<br>개념을 다시 잡아라.</h1><p>2025·2026학년도 평가원 6·9월·수능과 2027학년도 6월, 총 7회분의 반복 출제 축을 분석해 1~4단원 핵심만 다시 구성했습니다. 대부분은 사례·선지 판단형이며, 직접 입력은 답이 하나로 정해지는 개념어만 출제합니다. 띄어쓰기·문장 포함·가벼운 오타도 허용합니다.</p></section>
      <section class="grid two"><div>
        <div class="unit-list">${UNITS.map(renderUnit).join('')}</div>
      </div><aside>
        <div class="card"><h2>학습 시작</h2><p class="muted">체크한 소단원을 섞어 출제합니다.</p>
          <div class="overview"><div class="stat"><span>개념 완료</span><strong>${s.done}/${SUBUNITS.length}</strong></div><div class="stat"><span>누적 정답률</span><strong>${s.accuracy}%</strong></div><div class="stat"><span>오답 노트</span><strong>${s.wrong}</strong></div></div>
          <div class="setup-row"><div><label for="qCount">문제 수</label><select id="qCount"><option value="10" ${state.count==='10'?'selected':''}>10문제</option><option value="20" ${state.count==='20'?'selected':''}>20문제</option><option value="40" ${state.count==='40'?'selected':''}>40문제</option><option value="all" ${state.count==='all'?'selected':''}>선택 범위 전체</option></select></div><div><label for="qOrder">출제 순서</label><select id="qOrder"><option value="random" ${state.order==='random'?'selected':''}>랜덤</option><option value="sequential" ${state.order==='sequential'?'selected':''}>교재 순서</option></select></div></div>
          <button id="startSelected" class="primary full" ${state.selected.size?'':'disabled'}>선택 범위 퀴즈 (${state.selected.size}개 소단원)</button>
          <div class="button-row" style="margin-top:9px"><button id="selectAll" class="ghost">전체 선택</button><button id="clearAll" class="ghost">선택 해제</button></div>
          <div class="review-card"><h3>기출 함정 집중</h3><p>1·2차 자료, 변인, 가치 중립, 역할 갈등, 조직과 하위·반문화의 경계를 집중 복습합니다.</p><button id="weakQuiz" class="secondary full">기출 함정 퀴즈</button></div>
          <div class="review-card"><h3>오답 재시험</h3><p>재시험에서 맞히면 오답 노트에서 자동으로 빠집니다.</p><button id="wrongQuiz" class="secondary full" ${s.wrong?'':'disabled'}>오답 ${s.wrong}문제 다시 풀기</button></div>
          <div class="review-card"><h3>누적 복습</h3><p>개념 완료한 소단원 전체에서 20문제를 다시 꺼냅니다.</p><button id="cumulative" class="secondary full" ${s.done?'':'disabled'}>완료 범위 누적 복습</button></div>
        </div>
      </aside></section>`;
      bindHome();
    }
    function renderUnit(unit){const done=unit.subs.filter(x=>db.completed[x.id]).length;return`<article class="unit-card"><div class="unit-head"><div><span class="unit-index">${unit.id}단원</span><h3>${esc(unit.title)}</h3><p>${esc(unit.desc)}</p></div><div class="unit-progress"><strong>${done}/${unit.subs.length}</strong><small>개념 완료</small></div></div><div class="subunit-list">${unit.subs.map(sub=>{const st=subStats(sub.id);return`<div class="subunit-row"><input class="check sub-check" type="checkbox" data-id="${sub.id}" aria-label="${esc(sub.title)} 선택" ${state.selected.has(sub.id)?'checked':''}><div class="subunit-copy"><strong>${sub.id} · ${esc(sub.title)}</strong><small>${esc(sub.keywords)}${st.attempts?` · 정답률 ${st.accuracy}%`:''}</small></div><div class="sub-actions"><span class="done-dot ${db.completed[sub.id]?'on':''}" title="${db.completed[sub.id]?'개념 완료':'미완료'}"></span><button class="ghost compact study-btn" data-id="${sub.id}">개념 학습</button></div></div>`}).join('')}</div></article>`}
    function bindHome(){document.querySelectorAll('.sub-check').forEach(el=>el.addEventListener('change',()=>{el.checked?state.selected.add(el.dataset.id):state.selected.delete(el.dataset.id);renderHome()}));document.querySelectorAll('.study-btn').forEach(el=>el.addEventListener('click',()=>renderConcept(el.dataset.id)));document.getElementById('qCount').addEventListener('change',e=>state.count=e.target.value);document.getElementById('qOrder').addEventListener('change',e=>state.order=e.target.value);document.getElementById('startSelected').addEventListener('click',()=>startQuiz(QUESTIONS.filter(q=>state.selected.has(q.sub)),'선택 범위'));document.getElementById('selectAll').addEventListener('click',()=>{state.selected=new Set(SUBUNITS.map(x=>x.id));renderHome()});document.getElementById('clearAll').addEventListener('click',()=>{state.selected.clear();renderHome()});document.getElementById('weakQuiz').addEventListener('click',()=>startQuiz(QUESTIONS.filter(q=>q.weak),'취약 개념'));document.getElementById('wrongQuiz').addEventListener('click',()=>startQuiz(Object.keys(db.wrongBank).map(id=>Q_BY_ID.get(id)).filter(Boolean),'오답 재시험','all'));document.getElementById('cumulative').addEventListener('click',()=>startQuiz(QUESTIONS.filter(q=>db.completed[q.sub]),'누적 복습','20'))}

    function renderConcept(id){const sub=SUB_BY_ID.get(id);if(!sub)return renderHome();state.view='concept';state.concept=id;const idx=SUBUNITS.findIndex(x=>x.id===id);app.innerHTML=`<section><div class="page-head"><div><p class="eyebrow">${sub.unitId}단원 · 약 ${sub.time}분</p><h2>${esc(sub.title)}</h2><p>${esc(sub.keywords)}</p></div><button id="conceptHome" class="ghost compact">단원 목록</button></div><nav class="concept-nav" aria-label="소단원 이동"><button id="prevConcept" class="ghost compact" ${idx===0?'disabled':''}>← 이전</button>${SUBUNITS.map(x=>`<button class="ghost compact jump-concept" data-id="${x.id}" ${x.id===id?'disabled':''}>${x.id}</button>`).join('')}<button id="nextConcept" class="ghost compact" ${idx===SUBUNITS.length-1?'disabled':''}>다음 →</button></nav><div class="concept-grid">${sub.sections.map((sec,i)=>`<article class="card concept-section"><span class="badge green">개념 ${i+1}</span><h3 style="margin-top:12px">${esc(sec.title)}</h3><ul>${sec.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><div class="trap"><strong>함정 체크</strong><br>${esc(sec.trap)}</div></article>`).join('')}</div><div class="concept-finish"><button id="markDone" class="secondary">${db.completed[id]?'✓ 개념 확인 완료됨':'개념 확인 완료로 표시'}</button><button id="subQuiz" class="primary">이 소단원 퀴즈 ${QUESTIONS.filter(q=>q.sub===id).length}문제</button></div><p class="source-note">검토 기준: 2027 불후의 명강 사회·문화 개념 완성·정답과 바른 해설, 2027 EBS 수능특강·해설, 2025·2026학년도 평가원 6·9월·수능과 2027학년도 6월(총 7회분)의 반복 출제 개념. 기출 원문은 복제하지 않고 새 사례로 재구성했습니다.</p></section>`;
      document.getElementById('conceptHome').addEventListener('click',renderHome);document.getElementById('prevConcept').addEventListener('click',()=>renderConcept(SUBUNITS[idx-1]?.id));document.getElementById('nextConcept').addEventListener('click',()=>renderConcept(SUBUNITS[idx+1]?.id));document.querySelectorAll('.jump-concept').forEach(b=>b.addEventListener('click',()=>renderConcept(b.dataset.id)));document.getElementById('markDone').addEventListener('click',()=>{db.completed[id]=Date.now();saveDb();renderConcept(id);showToast('개념 완료를 저장했습니다.')});document.getElementById('subQuiz').addEventListener('click',()=>startQuiz(QUESTIONS.filter(q=>q.sub===id),`${id} 소단원`,'all'));
    }

    function startQuiz(pool,label,countOverride){if(!pool.length)return showToast('출제할 문제가 없습니다.');let qs=state.order==='random'?shuffle(pool):[...pool];const count=countOverride||state.count;if(count!=='all')qs=qs.slice(0,Math.min(Number(count),qs.length));state.session={label,questions:qs,index:0,answered:false,last:null,correct:0,wrong:0,results:[],startedAt:Date.now()};state.view='quiz';db.sessions++;saveDb();renderQuiz()}
    function submitAnswer(forcedInput){const ss=state.session;if(!ss||ss.answered)return nextQuestion();const q=ss.questions[ss.index],input=forcedInput??document.getElementById('answerInput')?.value.trim()??'',judged=check(q,input);ss.answered=true;ss.last={input,...judged,overridden:false};if(judged.correct)ss.correct++;else ss.wrong++;ss.results.push({id:q.id,input,correct:judged.correct,overridden:false});record(q,input,judged,ss.label);renderQuiz()}
    function nextQuestion(){const ss=state.session;if(!ss||!ss.answered)return;if(ss.index>=ss.questions.length-1){renderResult();return}ss.index++;ss.answered=false;ss.last=null;renderQuiz()}
    function renderQuiz(){const ss=state.session;if(!ss)return renderHome();state.view='quiz';const q=ss.questions[ss.index],sub=SUB_BY_ID.get(q.sub),r=ss.last,current=ss.index+1,total=ss.questions.length,typeLabel=q.type==='choice'?'기출형 선지 판단':'핵심 개념 빈칸';const answerArea=q.type==='choice'?`<div class="choice-list">${q.options.map((opt,i)=>{const selected=ss.answered&&Number(r.input)===i,cls=ss.answered&&i===q.correct?'correct-option':selected?'wrong-option':'';return`<button class="choice-option ${cls}" data-index="${i}" ${ss.answered?'disabled':''}><span>${i+1}</span><strong>${esc(opt)}</strong></button>`}).join('')}</div>${ss.answered?`<button id="submitAnswer" class="primary full choice-next">${current===total?'결과 보기':'다음 문제'}</button>`:'<div class="key-hint">선지를 누르면 바로 채점됩니다.</div>'}`:`<label class="answer-label" for="answerInput">내 답</label><div class="answer-row"><textarea id="answerInput" class="answer-input" rows="1" autocomplete="off" spellcheck="false" placeholder="핵심 개념어를 입력하세요" ${ss.answered?'disabled':''}>${ss.answered?esc(r.input):''}</textarea><button id="submitAnswer" class="primary">${ss.answered?(current===total?'결과 보기':'다음 문제'):'정답 확인'}</button></div><div class="key-hint">띄어쓰기·조사·짧은 문장·가벼운 오타 허용 · Enter로 확인</div>`;app.innerHTML=`<section class="quiz-wrap"><div class="quiz-head"><div class="quiz-meta"><span>${esc(ss.label)} · ${q.sub}</span><span>${current}/${total} · 정답 ${ss.correct}</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(current/total*100)}%"></div></div></div><article class="question-card"><div class="question-top"><span class="question-kicker">${typeLabel} · ${esc(sub.title)}</span>${q.weak?'<span class="badge warn">기출 함정</span>':''}</div><h2>${esc(q.prompt)}</h2>${answerArea}${ss.answered?renderFeedback(q,r):''}</article></section>`;
      document.querySelectorAll('.choice-option').forEach(b=>b.addEventListener('click',()=>submitAnswer(b.dataset.index)));const submit=document.getElementById('submitAnswer');if(submit)submit.addEventListener('click',ss.answered?nextQuestion:()=>submitAnswer());const input=document.getElementById('answerInput');if(input&&!ss.answered){input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitAnswer()}});requestAnimationFrame(()=>input.focus())}else if(ss.answered){document.getElementById('acceptMine')?.addEventListener('click',acceptCurrent);requestAnimationFrame(()=>submit?.focus())}}
    function renderFeedback(q,r){const cls=r.correct?'correct':'wrong',title=r.correct?'✓ 정답':'✕ 오답';return`<div class="feedback ${cls}"><div class="feedback-title">${title}${r.overridden?' · 사용자 정답으로 저장됨':''}</div><div class="feedback-grid"><div class="feedback-item"><small>정답</small><strong>${esc(q.answer)}</strong></div><div class="feedback-item"><small>내 답</small><strong>${esc(shownAnswer(q,r.input))}</strong></div></div><p class="explain">${esc(q.explain)}</p>${q.type==='blank'?'<div class="match-info">띄어쓰기와 문장 속 정답 포함을 허용하고, 짧은 개념어는 1글자·긴 개념어는 최대 2글자 오타까지 허용합니다.</div>':''}${q.type==='blank'&&!r.correct&&r.input?`<div class="feedback-actions"><button id="acceptMine" class="ghost compact">내 표현도 정답으로 저장</button></div>`:''}</div>`}

    function renderResult(){const ss=state.session;if(!ss)return renderHome();state.view='result';const total=ss.questions.length,accuracy=Math.round(ss.correct/total*100),wrong=ss.results.filter(x=>!x.correct);app.innerHTML=`<section class="card"><p class="eyebrow" style="text-align:center">${esc(ss.label)} 완료</p><div class="result-score">${accuracy}%</div><p class="result-copy">${total}문제 중 ${ss.correct}개 정답 · 오답 ${ss.wrong}개</p><div class="button-row" style="max-width:520px;margin:24px auto 0"><button id="resultHome" class="secondary">단원 목록</button><button id="retryResult" class="primary" ${wrong.length?'':'disabled'}>이번 오답 다시 풀기</button></div>${wrong.length?`<div style="margin-top:28px"><h3>이번 오답 ${wrong.length}문제</h3><div class="mistake-list">${wrong.map(row=>{const q=Q_BY_ID.get(row.id);return`<div class="mistake-row"><div><strong>${q.sub} · ${esc(q.prompt)}</strong><small>${q.type==='blank'?'핵심 개념 빈칸':'기출형 선지 판단'}</small></div><div><strong>정답: ${esc(q.answer)}</strong><div class="user-answer">내 답: ${esc(shownAnswer(q,row.input))}</div></div></div>`}).join('')}</div></div>`:'<div class="empty">완벽합니다. 이 범위의 오답은 모두 정리됐습니다.</div>'}</section>`;document.getElementById('resultHome').addEventListener('click',renderHome);document.getElementById('retryResult').addEventListener('click',()=>startQuiz(wrong.map(x=>Q_BY_ID.get(x.id)).filter(Boolean),'이번 오답 재시험','all'))}

    function renderStats(){state.view='stats';state.session=null;const s=stats(),wrong=Object.entries(db.wrongBank).map(([id,info])=>({q:Q_BY_ID.get(id),info})).filter(x=>x.q).sort((a,b)=>(b.info.lastWrongAt||0)-(a.info.lastWrongAt||0));app.innerHTML=`<section><div class="page-head"><div><p class="eyebrow">LOCAL STUDY DATA</p><h2>학습 기록</h2><p>개념 완료, 정답률, 오답, 직접 인정한 답안이 이 브라우저에 저장됩니다.</p></div><button id="statsHome" class="ghost compact">단원 목록</button></div><div class="card"><div class="overview"><div class="stat"><span>총 풀이</span><strong>${db.attempts}</strong></div><div class="stat"><span>정답률</span><strong>${s.accuracy}%</strong></div><div class="stat"><span>오답</span><strong>${s.wrong}</strong></div></div><div class="button-row"><button id="exportData" class="secondary">기록 백업</button><label class="ghost" for="importData" role="button" style="display:grid;place-items:center">기록 복원</label><input id="importData" class="file-input" type="file" accept="application/json,.json"><button id="resetData" class="danger">기록 초기화</button></div></div><div class="card" style="margin-top:14px"><h2>소단원별 현황</h2><div class="stats-table">${SUBUNITS.map(sub=>{const st=subStats(sub.id);return`<div class="stats-row"><span>${sub.id} · ${esc(sub.title)}</span><small>${db.completed[sub.id]?'개념 완료':'미완료'}</small><small>${st.attempts?`${st.accuracy}%`:'미응시'}</small></div>`}).join('')}</div></div><div class="card" style="margin-top:14px"><div class="page-head" style="margin-bottom:0"><div><h2>오답 노트</h2><p>${wrong.length}문제 · 최근 오답순</p></div><button id="statsReview" class="primary compact" ${wrong.length?'':'disabled'}>재시험</button></div>${wrong.length?`<div class="mistake-list">${wrong.map(({q,info})=>`<div class="mistake-row"><div><strong>${q.sub} · ${esc(q.prompt)}</strong><small>누적 오답 ${info.count||1}회</small></div><div><strong>정답: ${esc(q.answer)}</strong><div class="user-answer">최근 답: ${esc(info.lastAnswer||'(빈 답)')}</div></div></div>`).join('')}</div>`:'<div class="empty">아직 오답이 없습니다.</div>'}</div></section>`;document.getElementById('statsHome').addEventListener('click',renderHome);document.getElementById('statsReview').addEventListener('click',()=>startQuiz(wrong.map(x=>x.q),'오답 재시험','all'));document.getElementById('exportData').addEventListener('click',exportData);document.getElementById('importData').addEventListener('change',importData);document.getElementById('resetData').addEventListener('click',resetData)}
    function exportData(){const blob=new Blob([JSON.stringify({app:'samun2027-study',...db},null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`samun-2027-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast('학습 기록을 백업했습니다.')}
    async function importData(e){const file=e.target.files?.[0];if(!file)return;try{const p=JSON.parse(await file.text());if(p.app!=='samun2027-study'||p.version!==1)throw new Error();db={...blankDb(),...p,completed:p.completed||{},qStats:p.qStats||{},wrongBank:p.wrongBank||{},customAliases:p.customAliases||{}};saveDb();renderStats();showToast('기록을 복원했습니다.')}catch{showToast('이 앱의 올바른 백업 파일이 아닙니다.')}finally{e.target.value=''}}
    function resetData(){if(!confirm('사회·문화 개념 완료, 정답률, 오답과 사용자 답안을 모두 삭제할까요?'))return;db=blankDb();saveDb();renderStats();showToast('사회·문화 학습 기록을 초기화했습니다.')}
    function goHome(){if(state.view==='quiz'&&state.session?.index>0&&!confirm('진행 중인 퀴즈를 끝내고 단원 목록으로 갈까요?'))return;renderHome()}
    document.getElementById('homeLogo').addEventListener('click',goHome);document.getElementById('openStats').addEventListener('click',()=>{if(state.view==='quiz'&&!confirm('진행 중인 퀴즈를 끝내고 기록을 볼까요?'))return;renderStats()});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&state.view==='quiz'&&state.session?.answered){if(document.activeElement?.tagName==='BUTTON')return;e.preventDefault();nextQuestion()}});
    if(SUBUNITS.length!==13||QUESTIONS.length!==78){app.innerHTML=`<div class="card"><h2>데이터 검증 오류</h2><p>소단원 ${SUBUNITS.length}개, 문제 ${QUESTIONS.length}개가 로드되었습니다.</p></div>`}else renderHome();
  })();
  </script>
</body>
</html>
