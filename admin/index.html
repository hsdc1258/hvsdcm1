<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>HVS Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Inter,-apple-system,"Segoe UI",sans-serif}main{width:min(1100px,calc(100% - 30px));margin:45px auto}h1{font-size:clamp(35px,7vw,68px);letter-spacing:-.06em;margin:0 0 25px}.card{border:1px solid #272727;border-radius:18px;background:#101010;padding:20px;margin:12px 0}input,button{height:45px;border-radius:11px;border:1px solid #303030;background:#171717;color:#eee;padding:0 13px;font:inherit}button{cursor:pointer;font-weight:800}button.primary{background:#eee;color:#090909}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:16px;border:1px solid #272727;border-radius:14px}.stat small{color:#777}.stat strong{display:block;font-size:27px;margin-top:7px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #222;font-size:13px}th{color:#777}.danger{color:#ff8c8c}.hidden{display:none}.error{color:#ff8585;min-height:20px;margin-top:10px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.table-wrap{overflow:auto}th,td{white-space:nowrap}}
</style></head><body><main><h1>/admin</h1>
<section id="login" class="card"><form id="adminLogin"><p>관리자 비밀번호</p><div class="row"><input id="adminPassword" type="password" autocomplete="current-password" required autofocus><button class="primary">LOGIN</button></div><div id="loginError" class="error"></div></form></section>
<section id="panel" class="hidden"><div id="stats" class="stats"></div><div class="card"><h2>사용자 추가</h2><form id="addUser" class="row"><input id="newUsername" placeholder="아이디 (3자 이상)" required><input id="newPassword" type="password" placeholder="비밀번호 (6자 이상)" required><button class="primary">추가</button></form><div id="userError" class="error"></div></div><div class="card"><h2>사용자 및 접속 통계</h2><div class="table-wrap"><table><thead><tr><th>아이디</th><th>생성</th><th>최근 로그인</th><th>로그인</th><th>영단어 이벤트</th><th>사문 이벤트</th><th></th></tr></thead><tbody id="users"></tbody></table></div></div></section>
</main><script>
const API=localStorage.getItem('hvsdcm.api')||'https://hvsdcm-api.hvsdcm1.workers.dev';let adminToken=sessionStorage.getItem('hvsdcm.admin')||'';
const call=async(path,opt={})=>{const r=await fetch(API+path,{...opt,headers:{'content-type':'application/json','authorization':'Bearer '+adminToken,...(opt.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');return d},date=x=>x?new Date(x).toLocaleString('ko-KR'):'-';
async function load(){const [u,s]=await Promise.all([call('/api/admin/users'),call('/api/admin/stats')]);login.classList.add('hidden');panel.classList.remove('hidden');stats.innerHTML=[['사용자',s.totals.users],['활성 세션',s.totals.active_sessions],['24시간 이벤트',s.totals.events_24h],['공용 정답',s.totals.shared_answers]].map(x=>'<div class="stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');users.innerHTML=u.users.map(x=>'<tr><td>'+x.username+'</td><td>'+date(x.created_at)+'</td><td>'+date(x.last_login_at)+'</td><td>'+x.logins+'</td><td>'+x.word_events+'</td><td>'+x.sm_events+'</td><td><button class="danger" onclick="removeUser('+x.id+',\''+x.username+'\')">삭제</button></td></tr>').join('')}
adminLogin.onsubmit=async e=>{e.preventDefault();loginError.textContent='';try{const d=await call('/api/admin/login',{method:'POST',body:JSON.stringify({password:adminPassword.value})});adminToken=d.token;sessionStorage.setItem('hvsdcm.admin',adminToken);await load()}catch(x){loginError.textContent=x.message}};
addUser.onsubmit=async e=>{e.preventDefault();userError.textContent='';try{await call('/api/admin/users',{method:'POST',body:JSON.stringify({username:newUsername.value,password:newPassword.value})});e.target.reset();await load()}catch(x){userError.textContent=x.message}};
async function removeUser(id,name){if(!confirm(name+' 계정과 모든 학습 기록을 삭제할까요?'))return;await call('/api/admin/users/'+id,{method:'DELETE'});await load()}
if(adminToken)load().catch(()=>{adminToken='';sessionStorage.removeItem('hvsdcm.admin')});
</script></body></html>
