name = "hvsdcm-api"
main = "src/index.js"
compatibility_date = "2026-05-22"

[[d1_databases]]
binding = "DB"
database_name = "hvsdcm"
database_id = "0a6320b7-e7b7-4c9d-b13e-cab8ef423dea"

[[r2_buckets]]
binding = "GICHUL"
bucket_name = "hvsdcm-gichul"

# Required runtime secret:
#   npx wrangler secret put BEHAVIOR_PAPER_REPORT_TOKEN
[vars]
ALLOWED_ORIGIN = "https://hvsdcm1.xyz"
# 공모전 API가 사용하는 소유자 계정 목록. 비어 있으면 아무도 통과하지 못한다(fail-closed).
OWNER_USERNAME = "hvsdcm"
# Behavior Lab intentionally has a separate, single human-owner setting. Commas are rejected and
# an unset/invalid value denies every dashboard and paper read.
BEHAVIOR_OWNER_USERNAME = "hvsdcm"
