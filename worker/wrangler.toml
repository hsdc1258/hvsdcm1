name = "hvsdcm-api"
main = "src/index.js"
compatibility_date = "2026-05-22"

[[d1_databases]]
binding = "DB"
database_name = "hvsdcm"
database_id = "0a6320b7-e7b7-4c9d-b13e-cab8ef423dea"

[[r2_buckets]]
binding = "GICHUL"
bucket_name = "hvsdcm-gichul"

# Required runtime secrets:
#   npx wrangler secret put USAGE_INGEST_TOKEN
#   npx wrangler secret put HARNESS_INGEST_TOKEN
#   npx wrangler secret put MODERATOR_DAEMON_TOKEN
#   npx wrangler secret put BEHAVIOR_PAPER_REPORT_TOKEN
#   npx wrangler secret put COMPETITION_SUBMISSION_TOKEN
# Prefer scripts/competition-submission-secret.mjs so this value is supplied only on stdin.
[vars]
ALLOWED_ORIGIN = "https://hvsdcm1.xyz"
# GET /api/usage를 볼 수 있는 계정 목록(쉼표 구분). 이 값이 소유자 판정의 단일 원본이며,
# 비어 있으면 아무도 통과하지 못한다(fail-closed).
# claude-test는 로그인된 비소유자 404 경계를 검증하는 에이전트 전용 테스트 계정이다.
OWNER_USERNAME = "hvsdcm"
# Behavior Lab intentionally has a separate, single human-owner setting. Commas are rejected and
# an unset/invalid value denies every dashboard and paper read.
BEHAVIOR_OWNER_USERNAME = "hvsdcm"
