<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <!-- 미로그인 방문자는 이 문서를 스치고 랜딩으로 리다이렉트된다. 그 짧은 사이에 문서
       제목이 '사용량'을 말하면 소유자 전용 화면의 존재가 제목으로 한 번 새어 나간다
       (review-visual N7). 그래서 정지 제목은 랜딩과 같은 값이고, 소유자 응답을 실제로
       받은 뒤에만 usage.js가 제목을 올린다. -->
  <title>hvsdcm</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="/assets/css/system.css?v=20260901-competition-review-v1">
  <link rel="stylesheet" href="/usage/assets/css/usage.css?v=20260901-competition-review-v1">
  <script src="/usage/assets/js/competition.js?v=20260901-competition-review-v1" defer></script>
  <script src="/usage/assets/js/usage.js?v=20260901-competition-review-v1" defer></script>
</head>
<body class="workspace-app usage-page">
  <a class="skip-link" href="#usageMain">본문으로 건너뛰기</a>

  <header class="topbar">
    <div class="topbar-inner container-wide us-wide">
      <a class="brand" href="/" aria-label="hvsdcm 홈"><img class="brand-mark" src="/assets/logo.svg" alt="">hvsdcm</a>
      <span class="topbar-crumb">usage</span>
      <nav class="topbar-nav" aria-label="사이트 이동">
        <a class="topbar-link" href="/behavior-lab/#live"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-bolt"></use></svg>코인매매</a>
        <a class="topbar-link" href="/"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-home"></use></svg>홈</a>
      </nav>
    </div>
  </header>
  <div class="topbar-spacer"></div>

  <div class="container-wide us-wide app-page">
    <!-- 운영 화면이 둘이 되면서 탐색 사이드바가 생겼다 (DESIGN.md §1.1 적용 제외표 v11).
         admin과 같은 문법이다: 대문자 그룹 라벨 + 텍스트 항목, 활성 항목은 어두운 필.
         한 번에 한 뷰만 열린다 — 숨김은 CSS 클래스가 아니라 hidden 속성이고,
         .us-view의 기본 display가 none이라 저자 규칙이 [hidden]을 이기지 않는다. -->
    <div class="app-shell">
      <aside class="sidebar" aria-label="운영 화면">
        <div class="sidebar-product">
          <div class="sidebar-emblem" aria-hidden="true"><img class="brand-mark" src="/assets/logo.svg" alt=""></div>
          <div class="sidebar-product-copy"><span>CONTROL</span><strong>운영 센터</strong></div>
        </div>

        <div class="sidebar-group" role="tablist" aria-orientation="vertical" aria-label="운영 화면">
          <p class="sidebar-label">운영</p>
          <button id="tabOps" class="sidebar-item is-active" type="button" role="tab" aria-selected="true" aria-controls="viewOps" data-usage-view="ops"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-chart"></use></svg><span class="sidebar-item-text">실행 현황</span></button>
          <button id="tabCompetition" class="sidebar-item" type="button" role="tab" aria-selected="false" aria-controls="viewCompetition" data-usage-view="competition" tabindex="-1"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-trophy"></use></svg><span class="sidebar-item-text">공모전</span></button>
        </div>

        <nav class="sidebar-group" aria-label="워크스페이스 도구">
          <p class="sidebar-label">워크스페이스</p>
          <a class="sidebar-item sidebar-item-featured" href="/behavior-lab/#live"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-bolt"></use></svg><span class="sidebar-item-text">코인매매</span><span class="sidebar-item-meta">LIVE</span></a>
          <a class="sidebar-item" href="/WordMaster/"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-book-open"></use></svg><span class="sidebar-item-text">WordMaster</span></a>
          <a class="sidebar-item" href="/admin/"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-shield"></use></svg><span class="sidebar-item-text">관리자</span></a>
        </nav>

        <div class="sidebar-group">
          <p class="sidebar-label">범위</p>
          <p class="side-note">소유자 계정에서만 열리는 화면입니다. 실행 세션과 계정 한도를 간결하게 확인합니다.</p>
        </div>
      </aside>

      <main id="usageMain" class="app-main" tabindex="-1">
        <section id="viewOps" class="us-view" role="tabpanel" aria-labelledby="tabOps" tabindex="0">
          <header class="view-head">
            <div class="view-head-main">
              <div>
                <span class="workspace-kicker"><i aria-hidden="true"></i>CONTROL CENTER</span>
                <h1 class="title-1">AI 실행 현황</h1>
                <p>실행 세션, 진행 상태, Codex · Claude 한도</p>
              </div>
            </div>
            <div class="toolbar-group">
              <!-- 자동 갱신 시계. 1초마다 바뀌므로 aria-live를 걸지 않는다 — 수동 새로고침
                   결과만 아래 #usageRefreshStatus가 polite로 알린다. -->
              <span id="usageFreshness" class="us-freshness"></span>
              <button id="reload" class="btn btn-secondary btn-sm" type="button"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-refresh"></use></svg>새로고침</button>
            </div>
          </header>

          <p id="usageRefreshStatus" class="usage-refresh-status" aria-live="polite"></p>

          <p id="usageError" class="field-error" role="alert"></p>

          <!-- 소유자 전용 GET /api/usage의 Codex · Claude 한도와 하네스 작업을 같은 화면에 그린다. -->
          <div id="usageBody" class="us-body"></div>
        </section>

        <section id="viewCompetition" class="us-view" role="tabpanel" aria-labelledby="tabCompetition" tabindex="0" hidden>
          <header class="view-head cp-head">
            <div class="view-head-main">
              <div>
                <h1 class="title-1">공모전</h1>
                <p>승인 전에는 외부 제출을 실행하지 않습니다. 정확한 최종 제출 승인 뒤에는 승인된 내용만 1회 자동 제출합니다.</p>
              </div>
            </div>
            <div class="toolbar-group">
              <span id="competitionFreshness" class="us-freshness"></span>
              <button id="competitionReload" class="btn btn-secondary btn-sm" type="button">새로고침</button>
            </div>
          </header>

          <div id="competitionApprovalInbox" class="cp-approval-mount" aria-live="polite"></div>
          <p id="competitionRefreshStatus" class="usage-refresh-status" aria-live="polite"></p>
          <p id="competitionError" class="field-error" role="alert"></p>

          <form id="competitionFilters" class="cp-filters" aria-label="공모전 후보 필터">
            <div class="field cp-search">
              <label class="field-label" for="competitionSearch">후보 검색</label>
              <input id="competitionSearch" class="field-input field-input-sm" type="search" placeholder="이름 · 주최기관 · 자격" autocomplete="off">
            </div>
            <div class="field">
              <label class="field-label" for="competitionStatus">상태</label>
              <select id="competitionStatus" class="field-input field-input-sm">
                <option value="all">전체</option>
                <option value="watching">살펴보는 중</option>
                <option value="verifying">검증 중</option>
                <option value="preparing">지원 준비</option>
                <option value="awaiting-approval">승인 대기</option>
                <option value="approved">승인됨</option>
                <option value="applied">지원 완료</option>
                <option value="blocked">막힘</option>
                <option value="closed">종료</option>
                <option value="unknown">미확인</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="competitionEligibility">지원 자격</label>
              <select id="competitionEligibility" class="field-input field-input-sm">
                <option value="all">전체</option>
                <option value="eligible">지원 가능</option>
                <option value="review">확인 필요</option>
                <option value="ineligible">지원 불가</option>
                <option value="unknown">미확인</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="competitionOfficialVerification">공식 공고</label>
              <select id="competitionOfficialVerification" class="field-input field-input-sm">
                <option value="all">전체</option>
                <option value="verified">검증 완료</option>
                <option value="needs-review">확인 필요</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="competitionDeadline">마감</label>
              <select id="competitionDeadline" class="field-input field-input-sm">
                <option value="all">전체</option>
                <option value="7d">7일 안</option>
                <option value="30d">30일 안</option>
                <option value="later">30일 이후</option>
                <option value="overdue">마감 지남</option>
                <option value="unknown">미확인</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="competitionFee">지원 비용</label>
              <select id="competitionFee" class="field-input field-input-sm">
                <option value="all">전체</option>
                <option value="free">무료</option>
                <option value="paid">유료</option>
                <option value="unknown">미확인</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="competitionParticipation">추가 참여</label>
              <select id="competitionParticipation" class="field-input field-input-sm">
                <option value="all">전체</option>
                <option value="none">추가 일정 없음</option>
                <option value="online_only">온라인만</option>
                <option value="offline_required">대면·현장 필수</option>
                <option value="unknown">미확인</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="competitionSort">정렬</label>
              <select id="competitionSort" class="field-input field-input-sm">
                <option value="priority">조건 우선순위</option>
                <option value="deadline-asc">마감 임박순</option>
                <option value="deadline-desc">마감 늦은순</option>
              </select>
            </div>
          </form>

          <div id="competitionBody" class="cp-body" aria-busy="false">
            <p class="us-empty">공모전 탭을 열면 최신 스캔을 확인합니다.</p>
          </div>
        </section>

      </main>
    </div>
  </div>
</body>
</html>
