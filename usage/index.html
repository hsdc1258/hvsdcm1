<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <!-- 소유자 응답을 받기 전에는 비공개 운영 화면의 제목을 노출하지 않는다. -->
  <title>hvsdcm</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="/assets/css/system.css?v=20260904-icons-v1">
  <link rel="stylesheet" href="/usage/assets/css/usage.css?v=20260904-icons-v1">
  <script src="/usage/assets/js/competition.js?v=20260904-icons-v1" defer></script>
  <script src="/usage/assets/js/page.js?v=20260904-icons-v1" defer></script>
</head>
<body class="workspace-app usage-page">
  <a class="skip-link" href="#competitionMain">본문으로 건너뛰기</a>

  <header class="topbar">
    <div class="topbar-inner container-wide us-wide">
      <a class="brand" href="/" aria-label="hvsdcm 홈"><img class="brand-mark" src="/assets/logo.svg" alt="">hvsdcm</a>
      <span class="topbar-crumb">competition</span>
      <nav class="topbar-nav" aria-label="사이트 이동">
        <a class="topbar-link" href="/behavior-lab/#live"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-bolt"></use></svg>Behavior Lab</a>
        <a class="topbar-link" href="/"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-home"></use></svg>홈</a>
      </nav>
    </div>
  </header>
  <div class="topbar-spacer"></div>

  <div class="container-wide us-wide app-page">
    <div class="app-shell">
      <!-- 사이드바 항목은 아이콘 + 라벨 한 줄이다(DESIGN.md §6.1). 부제·범위 설명을 두지 않는다. -->
      <aside class="sidebar" aria-label="공모전 화면">
        <div class="sidebar-product">
          <div class="sidebar-emblem" aria-hidden="true"><img class="brand-mark" src="/assets/logo.svg" alt=""></div>
          <div class="sidebar-product-copy"><strong>공모전 센터</strong></div>
        </div>
        <nav class="sidebar-group" aria-label="화면 이동">
          <p class="sidebar-label">화면</p>
          <a class="sidebar-item is-active" href="/usage/" aria-current="page"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-trophy"></use></svg><span class="sidebar-item-text">후보와 승인</span></a>
        </nav>
        <nav class="sidebar-group" aria-label="워크스페이스 도구">
          <p class="sidebar-label">워크스페이스</p>
          <a class="sidebar-item" href="/behavior-lab/#live"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-bolt"></use></svg><span class="sidebar-item-text">Behavior Lab</span></a>
          <a class="sidebar-item" href="/WordMaster/"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-book-open"></use></svg><span class="sidebar-item-text">WordMaster</span></a>
          <a class="sidebar-item" href="/admin/"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-shield"></use></svg><span class="sidebar-item-text">관리자</span></a>
        </nav>
      </aside>

      <main id="competitionMain" class="app-main" tabindex="-1">
        <section class="cp-screen">
          <header class="view-head cp-head">
            <div class="view-head-main"><div>
              <h1 class="title-1">공모전</h1>
              <!-- 비가역 행동(자동 제출)의 조건만 한 문장으로 적는다(§3·§6.1). -->
              <p>최종 승인 전에는 외부 제출을 하지 않고, 승인 뒤 승인된 내용만 1회 자동 제출합니다.</p>
            </div></div>
            <div id="competitionToolbar" class="toolbar-group" hidden>
              <span id="competitionFreshness" class="us-freshness"></span>
              <button id="competitionReload" class="btn btn-secondary btn-sm" type="button">새로고침</button>
            </div>
          </header>
          <div id="competitionApprovalInbox" class="cp-approval-mount" aria-live="polite"></div>
          <!-- 상태·오류 안내 자리 하나. 두 p는 비면 접히므로 화면에는 한 문장만 선다 —
               어느 슬롯에 어떤 문구를 쓸지(권한 거절 vs 재시도 가능한 장애)는 JS가 정한다. -->
          <div class="cp-status">
            <p id="competitionRefreshStatus" class="usage-refresh-status" aria-live="polite"></p>
            <p id="competitionError" class="field-error" role="alert"></p>
          </div>
          <form id="competitionFilters" class="cp-filters" aria-label="공모전 후보 필터" hidden>
            <div class="field cp-search"><label class="field-label" for="competitionSearch">후보 검색</label><input id="competitionSearch" class="field-input field-input-sm" type="search" placeholder="이름 · 주최기관 · 자격" autocomplete="off"></div>
            <div class="field"><label class="field-label" for="competitionStatus">상태</label><select id="competitionStatus" class="field-input field-input-sm"><option value="all">전체</option><option value="watching">살펴보는 중</option><option value="verifying">검증 중</option><option value="preparing">지원 준비</option><option value="awaiting-approval">승인 대기</option><option value="approved">승인됨</option><option value="applied">지원 완료</option><option value="blocked">막힘</option><option value="closed">종료</option><option value="unknown">미확인</option></select></div>
            <div class="field"><label class="field-label" for="competitionEligibility">지원 자격</label><select id="competitionEligibility" class="field-input field-input-sm"><option value="all">전체</option><option value="eligible">지원 가능</option><option value="review">확인 필요</option><option value="ineligible">지원 불가</option><option value="unknown">미확인</option></select></div>
            <div class="field"><label class="field-label" for="competitionOfficialVerification">공식 공고</label><select id="competitionOfficialVerification" class="field-input field-input-sm"><option value="all">전체</option><option value="verified">검증 완료</option><option value="needs-review">확인 필요</option></select></div>
            <div class="field"><label class="field-label" for="competitionDeadline">마감</label><select id="competitionDeadline" class="field-input field-input-sm"><option value="all">전체</option><option value="7d">7일 안</option><option value="30d">30일 안</option><option value="later">30일 이후</option><option value="overdue">마감 지남</option><option value="unknown">미확인</option></select></div>
            <div class="field"><label class="field-label" for="competitionFee">지원 비용</label><select id="competitionFee" class="field-input field-input-sm"><option value="all">전체</option><option value="free">무료</option><option value="paid">유료</option><option value="unknown">미확인</option></select></div>
            <div class="field"><label class="field-label" for="competitionParticipation">추가 참여</label><select id="competitionParticipation" class="field-input field-input-sm"><option value="all">전체</option><option value="none">추가 일정 없음</option><option value="online_only">온라인만</option><option value="offline_required">대면·현장 필수</option><option value="unknown">미확인</option></select></div>
            <div class="field"><label class="field-label" for="competitionSort">정렬</label><select id="competitionSort" class="field-input field-input-sm"><option value="priority">조건 우선순위</option><option value="deadline-asc">마감 임박순</option><option value="deadline-desc">마감 늦은순</option></select></div>
          </form>
          <div id="competitionBody" class="cp-body" aria-busy="false"><p class="us-empty">최신 공모전 스캔을 확인하고 있습니다.</p></div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
