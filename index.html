<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="HVSDCM1">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HVSDCM1">
  <meta property="og:description" content="HVSDCM1">
  <meta property="og:url" content="https://hvsdcm1.xyz/">
  <meta property="og:image" content="https://hvsdcm1.xyz/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://hvsdcm1.xyz/assets/og.png">
  <title>HVSDCM1</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/css/system.css?v=20260904-mobile-v1">
  <link rel="stylesheet" href="/assets/css/home.css?v=20260904-icons-v1">
  <script src="/assets/js/site-icons.js?v=20260904-icons-v1" defer></script>
  <script src="/assets/js/home.js?v=20260904-icons-v1" defer></script>
</head>
<body class="home-page">
  <main id="main">
    <button id="wordmark" class="wordmark" type="button" data-login-trigger aria-label="HVSDCM1 열기"><span aria-hidden="true">HVSDCM1</span></button>
  </main>

  <div id="shade" class="shade" aria-hidden="true"></div>
  <aside id="drawer" class="drawer" aria-label="개인 메뉴" aria-hidden="true">
    <header class="drawer-head"><strong>HVSDCM1</strong><button id="closeDrawer" type="button" aria-label="메뉴 닫기"><svg class="ui-icon" aria-hidden="true"><use href="/assets/ui-icons.svg#icon-x"></use></svg></button></header>
    <!-- 두 마운트는 비어 있다. 로그인 뒤 home.js가 그룹 헤드 + 그룹 리스트를 만든다. -->
    <nav class="drawer-links" aria-label="바로가기">
      <div id="studyLinks" class="drawer-group"></div>
      <div id="ownerLinks" class="drawer-group"></div>
    </nav>
    <button id="drawerLogout" class="drawer-logout" type="button">로그아웃</button>
  </aside>

  <div id="loginModal" class="sheet-backdrop" aria-hidden="true">
    <form id="loginForm" class="sheet login-sheet" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <div><h1 id="loginTitle" class="sheet-title">로그인</h1></div>
      <div class="field"><label class="field-label" for="username">아이디</label><input class="field-input" id="username" autocomplete="username" required></div>
      <div class="field"><label class="field-label" for="password">비밀번호</label><input class="field-input" id="password" type="password" autocomplete="current-password" required></div>
      <div id="loginError" class="field-error" role="alert"></div>
      <div class="sheet-actions"><button class="btn btn-primary btn-lg" type="submit">계속</button><button class="btn btn-ghost" type="button" id="closeLogin">닫기</button></div>
    </form>
  </div>
</body>
</html>
