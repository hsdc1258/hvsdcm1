<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505">
<title>hvsdcm</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#f2f2f2;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh;overflow:hidden}
.menu-button{position:fixed;top:max(22px,env(safe-area-inset-top));left:22px;z-index:20;width:48px;height:48px;padding:13px;border:1px solid #242424;border-radius:14px;background:#0c0c0c;cursor:pointer;display:grid;align-content:center;gap:5px}.menu-button span{display:block;width:100%;height:2px;border-radius:99px;background:#ddd;transition:.25s}.menu-button.open span:first-child{transform:translateY(7px) rotate(45deg)}.menu-button.open span:nth-child(2){opacity:0}.menu-button.open span:last-child{transform:translateY(-7px) rotate(-45deg)}
.shade{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.58);opacity:0;pointer-events:none;transition:.25s}.shade.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset:0 auto 0 0;z-index:10;width:min(84vw,330px);padding:100px 20px 24px;background:#090909;border-right:1px solid #222;transform:translateX(-101%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}.drawer.open{transform:none}
.user{padding:0 5px 22px;color:#777;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em}.user strong{display:block;margin-top:6px;color:#eee;font-size:17px;letter-spacing:-.03em}
.nav{display:grid;gap:9px}.nav a,.nav button{width:100%;min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border:1px solid #242424;border-radius:15px;background:#101010;color:#eee;text-decoration:none;font:750 15px inherit;cursor:pointer}.nav a:hover,.nav button:hover{background:#171717;border-color:#383838}.arrow{color:#555}
.logout{position:fixed;left:22px;bottom:max(22px,env(safe-area-inset-bottom));z-index:8;display:none;min-height:43px;padding:0 15px;border:1px solid #242424;border-radius:12px;background:#0b0b0b;color:#888;font-weight:750;cursor:pointer}.logout.show{display:block}.logout:hover{color:#fff;border-color:#444}
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.78);backdrop-filter:blur(12px)}.modal.open{display:grid}.box{width:min(100%,380px);padding:25px;border:1px solid #292929;border-radius:20px;background:#0c0c0c;box-shadow:0 25px 100px #000}.box h1{margin:0 0 7px;font-size:28px}.box p{margin:0 0 20px;color:#777;font-size:13px}.box input{width:100%;height:49px;margin-top:9px;padding:0 14px;border:1px solid #292929;border-radius:12px;background:#151515;color:#fff;font:15px ui-monospace,monospace}.box button{width:100%;height:49px;margin-top:12px;border:0;border-radius:12px;background:#eee;color:#090909;font-weight:850;cursor:pointer}.box .close{background:transparent;color:#777;border:1px solid #292929}.error{min-height:18px;margin-top:10px;color:#ff8585;font-size:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<button id="menuButton" class="menu-button" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span><span></span></button>
<div id="shade" class="shade"></div>
<aside id="drawer" class="drawer" aria-label="주 메뉴">
  <div id="user" class="user">ACCOUNT<strong>로그인 필요</strong></div>
  <nav class="nav">
    <a href="/WordMaster/">WORDMASTER <span class="arrow">→</span></a>
    <a href="/smstudy/">사회문화 <span class="arrow">→</span></a>
    <button id="loginButton" type="button">LOGIN <span class="arrow">↳</span></button>
  </nav>
</aside>
<button id="logoutButton" class="logout" type="button">LOGOUT</button>
<div id="loginModal" class="modal"><form id="loginForm" class="box"><h1>LOGIN</h1><p>계정으로 학습 기록을 동기화합니다.</p><input id="username" autocomplete="username" placeholder="사용자명" required><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" required><div id="loginError" class="error"></div><button type="submit">ENTER</button><button type="button" id="closeLogin" class="close">닫기</button></form></div>
<script>
const API='https://hvsdcm-api.hvsdcm1.workers.dev',menuButton=document.getElementById('menuButton'),drawer=document.getElementById('drawer'),shade=document.getElementById('shade'),modal=document.getElementById('loginModal'),logoutButton=document.getElementById('logoutButton'),loginButton=document.getElementById('loginButton'),userBox=document.getElementById('user');
function toggleMenu(force){const open=force??!drawer.classList.contains('open');drawer.classList.toggle('open',open);shade.classList.toggle('open',open);menuButton.classList.toggle('open',open);menuButton.setAttribute('aria-expanded',String(open))}
function openLogin(){toggleMenu(false);modal.classList.add('open');setTimeout(()=>document.getElementById('username').focus(),50)}
function renderAccount(){const name=localStorage.getItem('hvsdcm.user'),token=localStorage.getItem('hvsdcm.token'),logged=!!(name&&token);userBox.innerHTML=logged?'ACCOUNT<strong>'+name.replace(/[&<>"']/g,'')+'</strong>':'ACCOUNT<strong>로그인 필요</strong>';loginButton.style.display=logged?'none':'flex';logoutButton.classList.toggle('show',logged)}
menuButton.onclick=()=>toggleMenu();shade.onclick=()=>toggleMenu(false);loginButton.onclick=openLogin;document.getElementById('closeLogin').onclick=()=>modal.classList.remove('open');
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const error=document.getElementById('loginError'),name=document.getElementById('username').value,pass=document.getElementById('password').value;error.textContent='';try{const r=await fetch(API+'/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:name,password:pass})}),d=await r.json();if(!r.ok)throw Error(d.error);localStorage.setItem('hvsdcm.token',d.token);localStorage.setItem('hvsdcm.user',d.user.username);modal.classList.remove('open');renderAccount();const next=new URLSearchParams(location.search).get('next');if(next)location.href=next}catch(x){error.textContent=x.message||'로그인 실패'}};
logoutButton.onclick=async()=>{const token=localStorage.getItem('hvsdcm.token');try{if(token)await fetch(API+'/api/logout',{method:'POST',headers:{authorization:'Bearer '+token}})}finally{localStorage.removeItem('hvsdcm.token');localStorage.removeItem('hvsdcm.user');sessionStorage.clear();renderAccount();toggleMenu(false)}};
renderAccount();if(new URLSearchParams(location.search).get('login')==='1'&&!localStorage.getItem('hvsdcm.token'))openLogin();
</script>
</body>
</html>
