<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="description" content="워드마스터 수능 2000 DAY 범위별 영단어 뜻 시험" />
  <title>Wordmaster 2000 Test</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/site-nav.css">
</head>
<body>
  <div class="app-shell">
    <header class="site-header" aria-label="상단 메뉴">
      <div class="brand-cluster">
        <a class="landing-home-link" href="/" aria-label="메인 랜딩 페이지로" title="메인으로">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3.5 10.5 8.5-7.5 8.5 7.5"/><path d="M5.5 9.5V21h13V9.5M9.5 21v-7h5v7"/></svg>
        </a>
        <button id="homeLogo" class="brand" type="button" aria-label="워드마스터 시작 화면으로">
          <span class="brand-mark">W</span>
          <span class="brand-copy">
            <strong>WORDMASTER</strong>
            <small>2000 TEST</small>
          </span>
        </button>
      </div>
      <div class="header-actions">
        <button id="openStatsBtn" class="ghost-btn compact" type="button">기록</button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
      <span>워드마스터 수능 2000 · DAY 01–50 · 2,000 words</span>
      <span>학습 기록은 계정 DB에 동기화됩니다.</span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/account.js" data-app="wordmaster" data-key="wordmaster2000.quiz.v1"></script>
  <script src="assets/js/words.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
